name: Tests

on:
  push:
    branches:
      - main
      - feature/broader-discovery-remove-watchlist
      - v4/sprint-1-live-solana-events
      - v4/sprint-1a-shrine-free-feed
      - v4/standalone-product
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node --check src/server.js && node --check src/v4/runtime.js && node --check public/app.js
      - run: npm test
